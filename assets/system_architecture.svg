<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="E-commerce search architecture with query understanding, lexical semantic and multimodal retrieval, LambdaMART ranking, cold-start fallback, FastAPI and Streamlit">
